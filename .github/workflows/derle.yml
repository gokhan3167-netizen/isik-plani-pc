name: Masaustu surumunu derle
on: workflow_dispatch
jobs:
  derle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            hedef: --win --x64
          - os: macos-latest
            hedef: --mac --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run vendor
      - run: node scripts/fixtures.mjs
      - run: npx electron-builder ${{ matrix.hedef }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: isik-plani-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
