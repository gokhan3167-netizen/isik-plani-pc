name: Masaustu surumunu derle
on: workflow_dispatch
jobs:
  derle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            hedef: --win --x64
          - os: macos-latest
            hedef: --mac --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run vendor
      - run: node scripts/fixtures.mjs
      - uses: actions/cache@v4
        with:
          path: gdtf-cache
          key: gdtf-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gdtf-${{ runner.os }}-
      - run: node scripts/gdtf.mjs
        env:
          GDTF_USER: ${{ secrets.GDTF_USER }}
          GDTF_PASS: ${{ secrets.GDTF_PASS }}
      - run: npx electron-builder ${{ matrix.hedef }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: isik-plani-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            ofl-kutuphane.json
            gdtf-kutuphane.json
